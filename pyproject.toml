[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrome-orchestrator"
version = "0.2.0"
description = "Classify, attribute and safely reap local Chrome instances on macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.scripts]
chor = "chrome_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
